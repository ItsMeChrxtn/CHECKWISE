# Netlify build settings for the CheckWise web client.
#
# Kept in the repo rather than typed into the Netlify UI so the settings are
# versioned and cannot drift. Netlify reads this automatically; the matching
# fields in the dashboard can be left blank.
#
# Only `client/` is deployed here. `server/` is an Express + MongoDB API and
# has to live somewhere that runs Node continuously — Render, in this setup.

[build]
  # Commands run from inside client/, and `publish` is resolved relative to it,
  # so this publishes client/dist.
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so the deploy compiles on the same major version the project was
  # developed against, rather than whatever Netlify happens to default to.
  NODE_VERSION = "22"

# Proxy the API through this site instead of calling Render from the browser.
#
# This has to come before the SPA catch-all: redirects are matched in order and
# the first hit wins, so a `/*` rule above these would swallow /api and hand
# back index.html.
#
# Doing it this way removes two separate failure modes for good:
#
#   1. No VITE_API_URL. The app's relative `/api` now resolves here and is
#      forwarded, so nothing about the API address is baked in at build time and
#      changing servers no longer needs a rebuild.
#   2. No CORS. As far as the browser is concerned every request is same-origin,
#      so CLIENT_URL on Render stops being able to break the site.
#
# The cost is one extra network hop, which is a fair trade for a setup that
# cannot be misconfigured into silence.
[[redirects]]
  from = "/api/*"
  to = "https://checkwise-b5ui.onrender.com/api/:splat"
  status = 200
  force = true

# Scan images and answer-sheet PDFs are served by the API host, not from here.
[[redirects]]
  from = "/uploads/*"
  to = "https://checkwise-b5ui.onrender.com/uploads/:splat"
  status = 200
  force = true

# The SPA fallback. Real files still win, so /checkwise.apk is served as the APK.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The APK is a download, not something to render in the browser tab.
[[headers]]
  for = "/checkwise.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"checkwise.apk\""
