<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CheckWise Smart Exam Checking System - scan, grade and report exam answer sheets automatically."
    />
    <!-- The bubble-and-check mark, matching components/Logo.jsx. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5bb0'/%3E%3Cpath d='M23.4 11.2A9 9 0 1 0 25 16' stroke='white' stroke-opacity='.55' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M11.2 16.4 15 20.2 24.4 10.4' stroke='white' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Source Serif 4 carries the headings, Inter the interface and the data.
      The stack in index.css named Inter but nothing ever loaded it, so every
      screen was really rendering in Segoe UI or Roboto.

      preconnect because the font is on the critical path for the first
      meaningful paint; `display=swap` so text is never invisible while it
      arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />

    <title>CheckWise - Smart Exam Checking. Accurate Results.</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
